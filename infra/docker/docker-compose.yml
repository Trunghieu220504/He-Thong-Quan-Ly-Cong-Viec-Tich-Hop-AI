services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pmai
      POSTGRES_USER: pmai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmai -d pmai"]
      interval: 10s
      timeout: 5s
      retries: 5
  ai-service:
    build: ../../ai-service
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build:
      context: ../..
      dockerfile: src/Host/ProjectManagementAI.Api/Dockerfile
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=pmai;Username=pmai;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      Jwt__Issuer: ProjectManagementAI
      Jwt__Audience: ProjectManagementAI.Client
      Cors__AllowedOrigins__0: http://localhost:3000
      AiService__BaseUrl: http://ai-service:8000
      Database__MigrateOnStartup: "true"
      Smtp__Host: mailhog
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/5000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports: ["5000:5000"]
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
  web:
    build:
      context: ../../web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_healthy
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
