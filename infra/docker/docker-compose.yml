services:
  postgres:
    image: postgres:16-alpine
    container_name: pmai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: pmai
      POSTGRES_USER: pmai
      POSTGRES_PASSWORD: pmai_Tuan2_2026

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmai -d pmai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ai-service:
    build:
      context: ../../ai-service
    container_name: pmai-ai-service
    restart: unless-stopped

    ports:
      - "8000:8000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
