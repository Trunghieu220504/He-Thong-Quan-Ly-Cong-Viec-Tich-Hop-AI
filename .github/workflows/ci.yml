
name: Backend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  backend:
    name: Build, Test and Validate Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ProjectManagementAI.slnx

      - name: Build Release
        run: dotnet build ProjectManagementAI.slnx -c Release --no-restore

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 9.0.8

      - name: Check Identity pending model changes
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Modules/Identity/Identity.Infrastructure
          --startup-project src/Host/ProjectManagementAI.Api
          --context IdentityDbContext

      - name: Check Projects pending model changes
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Modules/Projects/Projects.Infrastructure
          --startup-project src/Host/ProjectManagementAI.Api
          --context ProjectsDbContext

      - name: Run Architecture Tests
        run: dotnet test tests/ArchitectureTests/ArchitectureTests.csproj -c Release --no-restore

      - name: Validate Docker Compose
        run: docker compose -f infra/docker/docker-compose.yml config -q

  ai-service:
    name: Test AI Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AI service dependencies
        working-directory: ai-service
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run AI service tests
        working-directory: ai-service
        run: python -m pytest

  web:
    name: Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Lint web
        run: npm run lint --prefix web

      - name: Build web
        run: npm run build --prefix web
