
name: Backend CI

on:
  workflow_dispatch:
    inputs:
      smoke_mode:
        description: Smoke contract to validate
        type: choice
        options: [Baseline, Week5]
        default: Week5
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  backend:
    name: Build, Test and Validate Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ProjectManagementAI.slnx

      - name: Build Release
        run: dotnet build ProjectManagementAI.slnx -c Release --no-restore

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 9.0.8

      - name: Check Identity pending model changes
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Modules/Identity/Identity.Infrastructure
          --startup-project src/Host/ProjectManagementAI.Api
          --context IdentityDbContext

      - name: Check Projects pending model changes
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Modules/Projects/Projects.Infrastructure
          --startup-project src/Host/ProjectManagementAI.Api
          --context ProjectsDbContext

      - name: Check Sprints pending model changes
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Modules/Sprints/Sprints.Infrastructure
          --startup-project src/Host/ProjectManagementAI.Api
          --context SprintsDbContext

      - name: Check TaskManagement pending model changes
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Modules/TaskManagement/TaskManagement.Infrastructure
          --startup-project src/Host/ProjectManagementAI.Api
          --context TaskManagementDbContext

      - name: Check Notifications pending model changes when implemented
        shell: pwsh
        run: |
          $module = 'src/Modules/Notifications/Notifications.Infrastructure'
          $contexts = @(Get-ChildItem $module -Recurse -Filter '*DbContext.cs' |
            Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' })
          if ($contexts.Count -eq 0) {
            Write-Output '::notice::Notifications persistence is not implemented; PMS-168 full acceptance remains blocked.'
            exit 0
          }
          foreach ($context in $contexts) {
            dotnet ef migrations has-pending-model-changes --project $module --startup-project src/Host/ProjectManagementAI.Api --context $context.BaseName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run all .NET tests
        run: dotnet test ProjectManagementAI.slnx -c Release --no-restore

      - name: Validate Docker Compose
        env:
          POSTGRES_PASSWORD: ci-compose-placeholder
          JWT_SECRET_KEY: ci-compose-placeholder-at-least-32-characters
        run: docker compose -f infra/docker/docker-compose.yml config -q

  ai-service:
    name: Test AI Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AI service dependencies
        working-directory: ai-service
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run AI service tests
        working-directory: ai-service
        run: python -m pytest

  web:
    name: Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Lint web
        run: npm run lint --prefix web

      - name: Build web
        run: npm run build --prefix web

  docker-build:
    name: Docker build and integration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: pmai-ci
      COMPOSE_FILE: infra/docker/docker-compose.yml
      POSTGRES_PASSWORD: ci-only-disposable-db-password
      JWT_SECRET_KEY: ci-only-disposable-jwt-secret-at-least-32-characters
      SMOKE_MODE: ${{ inputs.smoke_mode || 'Baseline' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and start isolated stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Check web SPA, readiness and non-root API
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:3000/
          curl --fail http://localhost:3000/projects/smoke
          curl --fail http://localhost:5000/health/ready
          test "$(docker compose exec -T api id -u)" != 0
      - name: Smoke with AI available
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Start-Transcript -Path artifacts/smoke-ai-available.log
          try {
            ./tests/smoke/smoke-test.ps1 -Mode $env:SMOKE_MODE -AiState Available
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Stop-Transcript }
      - name: Stop AI for outage check
        run: docker compose stop ai-service
      - name: Smoke with AI unavailable
        shell: pwsh
        run: |
          Start-Transcript -Path artifacts/smoke-ai-unavailable.log
          try {
            ./tests/smoke/smoke-test.ps1 -Mode $env:SMOKE_MODE -AiState Unavailable
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Stop-Transcript }
      - name: Collect container logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps -a > artifacts/containers.txt
          docker compose logs --no-color > artifacts/compose.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-smoke-logs
          path: artifacts/
      - name: Stop disposable stack
        if: always()
        run: docker compose down --volumes
